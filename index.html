<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        input[type="text"] {
            padding: 10px;
            width: 80%;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Bem-vindo ao Meu Site</h1>
        <p>Digite o nome da nova página:</p>
        
        <!-- Campo onde a pessoa coloca o nome -->
        <input type="text" id="nomePagina" placeholder="Ex: perfil, contato, servicos">
        <br>
        
        <!-- Botão MINHA PAGINA -->
        <button id="btnMinhaPagina">MINHA PAGINA</button>
    </div>

    <script>
        document.getElementById('btnMinhaPagina').addEventListener('click', function() {
            const nomeDigitado = document.getElementById('nomePagina').value.trim();
            
            if (nomeDigitado === "") {
                alert("Por favor, insira um nome para a página!");
                return;
            }

            // Formata o nome para ser seguro como URL/arquivo (remove espaços e acentos básicos)
            const nomeFormatado = nomeDigitado
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/\s+/g, '-');

            // Caminho simulado na pasta paginasnovas/
            const caminhoArquivo = `paginasnovas/${nomeFormatado}.html`;

            // Redireciona ou simula a criação/abertura da página
            console.log(`Abrindo o arquivo: ${caminhoArquivo}`);
            alert(`Redirecionando para: ${caminhoArquivo}`);
            
            // Exemplo de redirecionamento (caso o arquivo já exista no servidor/repositório)
            window.location.href = caminhoArquivo;
        });
    </script>

</body>
</html>
